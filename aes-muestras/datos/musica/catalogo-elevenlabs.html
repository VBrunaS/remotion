const lista=document.getElementById('lista');
const marcados=new Set();
try{(JSON.parse(localStorage.getItem('aes-musica')||'[]')).forEach(i=>marcados.add(i));}catch(e){}
for(const it of items){
  const d=document.createElement('div');d.className='tema';d.dataset.id=it.id;
  d.dataset.texto=(it.titulo+' '+it.etiquetas.join(' ')+' '+it.pagina).toLowerCase();d.dataset.cat=it.pagina;
  d.innerHTML=`<input type="checkbox" ${marcados.has(it.id)?'checked':''}>
  <div><div class="titulo"><span class="cat">${it.pagina}</span>${it.titulo}</div><div class="etq">${it.etiquetas.join(' · ')}</div></div>
  <audio controls preload="none" src="${it.url}"></audio>`;
  if(marcados.has(it.id)) d.classList.add('marcado');
  d.querySelector('input').addEventListener('change',e=>{e.target.checked?marcados.add(it.id):marcados.delete(it.id);d.classList.toggle('marcado',e.target.checked);guardar();});
  lista.appendChild(d);
}
function guardar(){try{localStorage.setItem('aes-musica',JSON.stringify([...marcados]));}catch(e){}document.getElementById('resumen').textContent=marcados.size+' marcados';filtrar();}
function filtrar(){const q=document.getElementById('q').value.toLowerCase().trim();const c=document.getElementById('cat').value;const solo=document.getElementById('solo').checked;
  for(const d of lista.children){const ok=(!q||d.dataset.texto.includes(q))&&(!c||d.dataset.cat===c)&&(!solo||marcados.has(d.dataset.id));d.classList.toggle('oculto',!ok);}}
document.getElementById('q').addEventListener('input',filtrar);document.getElementById('cat').addEventListener('change',filtrar);document.getElementById('solo').addEventListener('change',filtrar);
document.getElementById('copiar').addEventListener('click',()=>{const txt=items.filter(i=>marcados.has(i.id)).map(i=>i.id+' | '+i.titulo).join('\n')||'(nada marcado)';const s=document.getElementById('sel');s.hidden=false;s.textContent=txt;navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{});});
// solo un audio a la vez
document.addEventListener('play',e=>{for(const a of document.querySelectorAll('audio')) if(a!==e.target) a.pause();},true);
guardar();
</script></body></html>
